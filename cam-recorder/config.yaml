name: Cam Recorder
version: "0.3.0"
slug: cam_recorder
description: Ringpuffer-Aufnahme für RTSP-Kameras, Ereignis-Clips nach Backblaze B2
url: https://github.com/masteph92/ha-cam-recorder
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
# Seitenleiste: eigene Startansicht (Tablet/Monitor). Derselbe Port ist für
# Wandtablets im LAN freigegeben, dort nur mit ui.kiosk_key.
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Kameras
# /tmp als tmpfs: Ausweichspeicher, wenn der Netzwerk-Share fehlt
tmpfs: true
map:
  - type: share
    read_only: false
ports:
  8099/tcp: 8580
  8554/tcp: null
ports_description:
  8099/tcp: Startansicht für Tablets im LAN (nur mit ui.kiosk_key)
  8554/tcp: RTSP-Restream (go2rtc), nur bei Bedarf freigeben
options:
  site: mg
  segment_seconds: 5
  recording: true
  audio: false
  cameras: []
  event:
    pre_seconds: 30
    post_seconds: 60
    max_seconds: 600
  storage:
    primary: /share/cam-recorder
    primary_max_gb: 450
    fallback: /tmp/cam-recorder
    fallback_keep_seconds: 120
    create_marker: false
  ui:
    title: ""
    kiosk_key: ""
    rotate_seconds: 12
    pin_minutes: 5
  upload:
    enabled: false
    remote: ""
    b2_account: ""
    b2_key: ""
    daily_budget_gb: 5
schema:
  site: match(^[a-z0-9][a-z0-9_]*$)
  segment_seconds: int(2,30)
  recording: bool
  audio: bool
  cameras:
    - name: match(^[a-z0-9][a-z0-9_]*$)
      rtsp: password
      triggers:
        - str
      suppress: str?
      snapshot_url: password?
      label: str?
      rtsp_sub: password?
      door_entity: str?
      signal_entity: str?
      wired: bool?
  event:
    pre_seconds: int(0,300)
    post_seconds: int(10,600)
    max_seconds: int(60,7200)
  storage:
    primary: str
    primary_max_gb: float(1,)
    fallback: str
    fallback_keep_seconds: int(30,900)
    create_marker: bool
  ui:
    title: str?
    kiosk_key: password?
    rotate_seconds: int(3,300)
    pin_minutes: int(1,120)
  upload:
    enabled: bool
    remote: str?
    b2_account: str?
    b2_key: password?
    daily_budget_gb: float(0.1,)
